<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graduate Resume Builder</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 12px; }
  input, textarea { width: 100%; padding: 8px; margin: 4px 0 12px; box-sizing: border-box; }
  #resume { border: 1px solid #999; padding: 16px; margin-top: 20px; }
  #rName { margin: 0; }
</style>
</head>
<body>
<h1>Graduate Resume Builder</h1>

<label>Full name</label>
<input id="name">
<label>Email</label>
<input id="email">
<label>Phone</label>
<input id="phone">
<label>Short summary (2-3 sentences)</label>
<textarea id="summary" rows="4"></textarea>

<div id="resume">
  <h2 id="rName">Your Name</h2>
  <p id="rContact">email | phone</p>
  <h3>Summary</h3>
  <p id="rSummary">Your summary will appear here.</p>
</div>

<script>
function update() {
  document.getElementById("rName").textContent = document.getElementById("name").value || "Your Name";
  document.getElementById("rContact").textContent =
    document.getElementById("email").value + " | " + document.getElementById("phone").value;
  document.getElementById("rSummary").textContent =
    document.getElementById("summary").value || "Your summary will appear here.";
}
document.querySelectorAll("input, textarea").forEach(function (el) {
  el.oninput = update;
});
</script>
</body>
</html>
